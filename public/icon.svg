<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#012d1d" />
      <stop offset="100%" stop-color="#0b1b14" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
  </defs>
  <!-- Background with slight rounded corners for standalone icon -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#2D6A4F" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Modern Industrial Tractor / Precision Drill Graphic -->
  <g transform="translate(56, 70) scale(0.78)">
    <!-- Cabin Body -->
    <path d="M120 180 L220 180 L260 260 L380 260 L400 340 L80 340 L80 240 Z" fill="#2D6A4F" stroke="#000" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Roof / GPS Dome -->
    <path d="M100 180 L230 180" stroke="#4ade80" stroke-width="16" stroke-linecap="round" />
    <ellipse cx="165" cy="155" rx="30" ry="16" fill="#4ade80" stroke="#000" stroke-width="6" />
    <path d="M165 140 L165 115" stroke="#4ade80" stroke-width="8" stroke-linecap="round" />
    <circle cx="165" cy="110" r="10" fill="#ffffff" />
    
    <!-- Glass Window -->
    <path d="M130 195 L210 195 L245 255 L130 255 Z" fill="#c1ecd4" stroke="#012d1d" stroke-width="6" />
    
    <!-- Hood / Front Engine -->
    <path d="M260 260 L400 260 L410 340 L260 340 Z" fill="#1b4332" stroke="#000" stroke-width="8" />
    <!-- Grill slats -->
    <line x1="370" y1="280" x2="370" y2="330" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />
    <line x1="385" y1="280" x2="385" y2="330" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />
    <line x1="400" y1="285" x2="400" y2="325" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />
    
    <!-- Exhaust Pipe -->
    <path d="M280 260 L280 200 L290 190" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Rear Giant Wheel -->
    <circle cx="150" cy="360" r="85" fill="#0A0A0A" stroke="#2D6A4F" stroke-width="12" />
    <circle cx="150" cy="360" r="50" fill="#2D6A4F" stroke="#000" stroke-width="6" />
    <circle cx="150" cy="360" r="22" fill="#4ade80" />
    <!-- Treads -->
    <path d="M150 275 L150 295 M150 425 L150 445 M65 360 L85 360 M215 360 L235 360 M90 300 L105 315 M195 405 L210 420 M90 420 L105 405 M195 315 L210 300" stroke="#4ade80" stroke-width="8" stroke-linecap="round" />

    <!-- Front Wheel -->
    <circle cx="360" cy="385" r="60" fill="#0A0A0A" stroke="#2D6A4F" stroke-width="10" />
    <circle cx="360" cy="385" r="32" fill="#2D6A4F" stroke="#000" stroke-width="6" />
    <circle cx="360" cy="385" r="14" fill="#4ade80" />
    <path d="M360 325 L360 340 M360 430 L360 445 M300 385 L315 385 M405 385 L420 385" stroke="#4ade80" stroke-width="6" stroke-linecap="round" />
    
    <!-- Precision Drill Seeder Tines in Ground -->
    <g transform="translate(0, 440)">
      <!-- Furrow Line -->
      <path d="M20 30 Q120 15 240 30 T480 30" fill="none" stroke="#4ade80" stroke-width="6" stroke-dasharray="12 8" />
      <!-- Seeds dropping -->
      <circle cx="80" cy="20" r="6" fill="#4ade80" />
      <circle cx="180" cy="20" r="6" fill="#4ade80" />
      <circle cx="280" cy="20" r="6" fill="#4ade80" />
      <circle cx="380" cy="20" r="6" fill="#4ade80" />
    </g>
  </g>
</svg>
